
name: UrbanFlow - Tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  pruebas:
    name: Ejecutar tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: urbanflow
          POSTGRES_PASSWORD: urbanflow_ci
          POSTGRES_DB: urbanflow_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U urbanflow -d urbanflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_TEST_PASSWORD: urbanflow_ci

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest "psycopg[binary]"

      - name: Ejecutar tests
        run: python -m pytest -v
